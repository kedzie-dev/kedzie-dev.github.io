<header class="site-header">
  <div class="site-header-inner">
    <a class="site-brand" href="{{ "/" | relLangURL }}">kedzie.dev</a>
    <nav class="site-nav" aria-label="주요 메뉴">
      {{ $current := .RelPermalink }}
      <ul>
        {{ range site.Menus.main }}
          {{ $url := .URL }}
          {{ with .Page }}{{ $url = .RelPermalink }}{{ end }}
          <li><a href="{{ $url }}"{{ if or (eq $current $url) (and (ne $url "/") (hasPrefix $current $url)) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
    {{ if site.Params.enableSearch }}<button class="search-toggle" type="button" aria-label="검색 열기" aria-haspopup="dialog" aria-controls="search-panel">검색</button>{{ end }}
  </div>
</header>
